{% extends "base.html" %}
{% block content %}
<div class="auth-container">

        <h1 class="text-danger">Redirecting...</h1>
        <p>Authentication failed. Taking you back to login page.</p>

        window.location.href = "{% url 'account_login' %}";
    }, 2000);
</script>
{% endblock %}
