{% extends "base.html" %}

{% block css %}
    {% load sass_tags %}
    <link rel="stylesheet" href="{% sass_src "deps/css/password_reset_done.scss" %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card fade-in">
        <div class="auth-header">
            <h1>Check Your Email</h1>
            <p>We have sent you an e-mail. Please check your inbox and follow the link to reset your password.</p>
        </div>
        <div class="form-footer">
            <a href="{% url 'account_login' %}" class="btn btn-primary">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
