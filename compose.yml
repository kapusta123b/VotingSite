services:
  web:
    
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: voting-web

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    expose:
      - 8000

    volumes:
      - static_volume:/app/staticfiles

    environment:
      - SECRET_KEY
      - ALLOWED_HOSTS
      - CSRF_TRUSTED_ORIGINS
      - DEBUG=False
      - DB_NAME
      - DB_USER
      - DB_PASS
      - DB_HOST=db
      - DB_PORT
      - RECAPTCHA_PUBLIC_KEY
      - RECAPTCHA_PRIVATE_KEY
      - EMAIL_NAME
      - EMAIL_APP_PASSWORD

    # How is the number of workers calculated for gunicorn?
    # Number of workers = (2 × CPU cores) + 1
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 5 --timeout 120

  db:
    image: postgres:18.4

    container_name: voting-db

    restart: unless-stopped
    
    volumes:
      - data:/var/lib/postgresql/

    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASS}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine-slim

    container_name: voting-nginx

    restart: unless-stopped

    depends_on:
      - web

    ports:
      - 80:80

    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
  # if you want database managment in your website
  # adminer:
  #   image: adminer:5.5.0

  #   ports:
  #     - 8080:8080

  #   restart: unless-stopped

  #   depends_on:
  #     - db

volumes:
  data:
  static_volume:
